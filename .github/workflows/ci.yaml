name: ci
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
      with:
        go-version: '^1.21'
    - run: |
        make
        make test
